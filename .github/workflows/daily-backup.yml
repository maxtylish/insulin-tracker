name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00 = 台灣時間 02:00
  workflow_dispatch:         # 允許手動觸發

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch insulin_records from Supabase
        env:
          SUPABASE_URL: https://nbslellpcqsqbsdjkiqa.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p backups

          curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/rest/v1/insulin_records?select=*&limit=10000" \
            -o "backups/$DATE.json"

          echo "Backup saved: backups/$DATE.json"
          wc -c "backups/$DATE.json"

      - name: Commit backup
        run: |
          git config user.name  "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date -u +"%Y-%m-%d") auto backup"
          git push
